name: CI Advanced
 
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
 
jobs:
      

  lint:
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.make_id.outputs.build_id }} (lint.outputs.build_id)
    steps:
      - name: Get the code
        uses: actions/checkout@v4
 
      - name: Run the linter
        run: npm run lint
 
      - name: Create a build ID
        id: make_id
        run: echo "build_id=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

 
     
 
  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18', '20', '22']
    steps:
      - name: Get the code
        uses: actions/checkout@v4
 
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
 
      - name: Install dependencies
        run: npm ci
 
      - name: Run the tests and save the output
        run: npm test > test-output-${{ matrix.os }}-node${{ matrix.node }}.txt
 
      - name: Upload the test output
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-node${{ matrix.node }}
          path: test-output-${{ matrix.os }}-node${{ matrix.node }}.txt
  
  report:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Download every artifact from this run
        uses: actions/download-artifact@v4
        with:
          path: all-results
 
      - name: Show what we collected
        run: |
          echo "Build ID from the lint job: ${{ needs.lint.outputs.build_id }}"
          ls -R all-results



 
     